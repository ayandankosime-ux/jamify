<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamify - Spotify Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bottom-player">
    <div class="song-info">
      <img class="song-image" src="song-image.gif" alt="song-image">
      <div class="song-details">
        <h4 class="song-name">Song Name</h4>
        <p class="song-artist">Artist Name</p>
      </div>
    </div>

    <div class="player-controls">
      <div class="control-buttons">

        <button class="btn btn-prev">
          <img class="img prev-img"  src="music-player-icons/back.png" alt="previous button">
        </button>
        <button class="btn btn-play">
          <img class="img play-img"  src="music-player-icons/play.png" alt="play button">
        </button>
        <button class="btn btn-next">
          <img class="img next-img" src="music-player-icons/next.png" alt="next button">
        </button>
      </div>

      <input class="progress-bar" id="progressBar" type="range">
    </div>
  </div>
</body>
</html>
